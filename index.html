<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Through Chun Chun's Lens</title>

  <style>
    body{
      margin:0;
      background:#f5f5f5;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      background:rgba(255,255,255,.7);
      backdrop-filter:blur(18px);
      border-radius:24px;
      padding:60px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    h1{
      margin:0;
      font-size:42px;
      font-weight:700;
    }

    p{
      margin-top:18px;
      color:#666;
      font-size:18px;
    }
  </style>
</head>

<body>

<div class="card">
    <h1>Through Chun Chun's Lens</h1>
    <p>The journey begins here.</p>
</div>

</body>
</html>
