<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Through Chun Chun's Lens</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px;
      background:
        radial-gradient(circle at top left, #eef5ff, transparent 45%),
        radial-gradient(circle at bottom right, #f4ecff, transparent 45%),
        #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1d1d1f;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 760px;
      padding: 48px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 48px);
      letter-spacing: -1.5px;
    }

    .subtitle {
      margin: 14px 0 32px;
      color: #6e6e73;
      font-size: 17px;
      line-height: 1.6;
    }

    .upload-area {
      display: block;
      padding: 42px 24px;
      border: 1.5px dashed rgba(29, 29, 31, 0.25);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.45);
      cursor: pointer;
      transition: 0.25s ease;
    }

    .upload-area:hover {
      background: rgba(255, 255, 255, 0.75);
      transform: translateY(-2px);
    }

    .upload-icon {
      font-size: 40px;
      margin-bottom: 14px;
    }

    .upload-title {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 650;
    }

    .upload-hint {
      margin: 0;
      color: #86868b;
      font-size: 14px;
    }

    input[type="file"] {
      display: none;
    }

    .preview-box {
      display: none;
      margin-top: 28px;
    }

    .preview-box img {
      display: block;
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.04);
    }

    .file-name {
      margin: 14px 0 0;
      color: #6e6e73;
      font-size: 14px;
      word-break: break-all;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
      }

      .app {
        padding: 34px 20px;
        border-radius: 26px;
      }

      .upload-area {
        padding: 34px 18px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>Through Chun Chun's Lens</h1>

    <p class="subtitle">
      Choose one photo and begin creating your own visual story.
    </p>

    <label class="upload-area" for="photoInput">
      <div class="upload-icon">＋</div>
      <p class="upload-title">選擇一張照片</p>
      <p class="upload-hint">支援 JPG、JPEG、PNG</p>
    </label>

    <input
      type="file"
      id="photoInput"
      accept=".jpg,.jpeg,.png,image/jpeg,image/png"
    >

    <section class="preview-box" id="previewBox">
      <img id="photoPreview" alt="照片預覽">
      <p class="file-name" id="fileName"></p>
    </section>
  </main>

  <script>
    const photoInput = document.getElementById("photoInput");
    const previewBox = document.getElementById("previewBox");
    const photoPreview = document.getElementById("photoPreview");
    const fileName = document.getElementById("fileName");

    photoInput.addEventListener("change", function () {
      const selectedFile = photoInput.files[0];

      if (!selectedFile) {
        return;
      }

      const photoUrl = URL.createObjectURL(selectedFile);

      photoPreview.src = photoUrl;
      fileName.textContent = selectedFile.name;
      previewBox.style.display = "block";
    });
  </script>
</body>
